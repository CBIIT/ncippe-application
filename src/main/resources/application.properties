spring.jpa.show-sql=false
spring.h2.console.enabled=false
#spring.servlet.multipart.max-file-size=10000KB
#spring.servlet.multipart.max-request-size=10000KB
#Logging values
## logging.level=ERROR
##logging.level=TRACE
## logging.level.gov.nci.ppe=TRACE
logging.level=INFO
logging.level.gov.nci.ppe=INFO
logging.level.org.hibernate=ERROR
# logging.level.org.hibernate=DEBUG
logging.file.name=logs/NCIPPEApplication.log
############################# Properties for MySQL #############################
## MySQL
spring.datasource.url=jdbc:mysql://${DB_HOSTNAME}:3306/${DB_NAME}?user=${DB_USERNAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
## Hibernate Properties
## The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
## Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=none
# Customizing the naming convention for Spring
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#Patient Report properties
patient.report.bucket.name=${TEST_RPT_BUCKET}
#NIH Mail Server Properties
spring.mail.host=mailfwd.nih.gov
spring.mail.port=25
spring.mail.username=moonshotbiobank@nih.gov
#spring.mail.password=password
# Other properties
#spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
#Email properties
email.sender.address=${EMAIL_ADDRESS}
email.hostname=${HOSTNAME}
email.restrict.outgoing.domain=${RESTRICT_OUTGOING_EMAIL_DOMAIN}
email.allowed.outgoing.domain=nih.gov,gmail.com
email.forward.restricted.emails.to=${DEFAULT_DESTINATION_EMAIL}
#Audit log properties
audit.log.group=${AUDIT_LOG_GROUP}
audit.log.stream=${AUDIT_LOG_STREAM}

# Multipart file size limit
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB

# Oauth2 Configuration
logingov.logout-url=${LOGINGOV_LOGOUT_URL}
logingov.logout-redirect-uri=${LOGINGOV_LOGOUT_REDIRECT_URI}
logingov.smsession-url=${LOGINGOV_SESSION_URL}
spring.security.oauth2.client.registration.logingov.client_id=${LOGINGOV_CLIENT_ID}
spring.security.oauth2.client.registration.logingov.client_secret=${LOGINGOV_CLIENT_SECRET}
spring.security.oauth2.client.registration.logingov.scope=${LOGINGOV_SCOPE}
spring.security.oauth2.client.registration.logingov.redirect-uri=${LOGINGOV_REDIRECT_URI}
spring.security.oauth2.client.registration.logingov.authorization-grant-type=${LOGINGOV_AUTHORIZATION_GRANT_TYPE}
## spring.security.oauth2.client.registration.logingov.provider=
spring.security.oauth2.client.provider.logingov.authorization-uri=${LOGINGOV_AUTHORIZATION_URI}
spring.security.oauth2.client.provider.logingov.token-uri=${LOGINGOV_TOKON_URI}
spring.security.oauth2.client.provider.logingov.user-info-uri=${LOGINGOV_USER_INFO_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOGINGOV_JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${LOGINGOV_JWT_ISSUER_URI}

