logingov.logout-redirect-uri=https://moonshotbiobank-dev.cancer.gov/signout
spring.security.oauth2.client.registration.logingov.client_id=59867959-d6b1-426a-838a-b2b5ece252b0
spring.security.oauth2.client.registration.logingov.client_secret=d6ce146f-e310-438c-a0ea-9395b3caad41
spring.security.oauth2.client.registration.logingov.scope=openid, email, profile
spring.security.oauth2.client.registration.logingov.redirect-uri=https://moonshotbiobank-dev.cancer.gov/auth/callback
spring.security.oauth2.client.registration.logingov.authorization-grant-type=code
